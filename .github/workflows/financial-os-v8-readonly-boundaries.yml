name: Financial OS V8 read-only boundaries

on:
  pull_request:
    paths:
      - "financial_os_v8/read_only_snapshot_verifier.cjs"
      - "financial_os_v8/test_read_only_snapshot_verifier.cjs"
      - "financial_os_v8/read_only_project_screening_verifier.cjs"
      - "financial_os_v8/test_read_only_project_screening_verifier.cjs"
      - "financial_os_v8/READ_ONLY_SNAPSHOT_CONSUMER_20260817.md"
      - "financial_os_v8/READ_ONLY_PROJECT_SCREENING_CONSUMER_20260817.md"
      - ".github/workflows/financial-os-v8-readonly-boundaries.yml"
  workflow_dispatch:

concurrency:
  group: financial-os-v8-readonly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readonly-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check snapshot verifier
        run: node --check financial_os_v8/read_only_snapshot_verifier.cjs

      - name: Syntax check project-screening verifier
        run: node --check financial_os_v8/read_only_project_screening_verifier.cjs

      - name: Run snapshot verifier regression suite
        run: node financial_os_v8/test_read_only_snapshot_verifier.cjs

      - name: Run project-screening verifier regression suite
        run: node financial_os_v8/test_read_only_project_screening_verifier.cjs
