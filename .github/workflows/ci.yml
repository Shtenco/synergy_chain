name: Validate SINERGYCHAIN source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          mkdir -p _source
          tar -xzf source/SINERGYCHAIN_GROWTH_OS_V7_SOURCE.tar.gz -C _source
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run validation
        working-directory: _source
        run: npm run check

  qe-v10-evm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile V10
        working-directory: qe_v10
        run: forge build
      - name: Run V10 EVM tests
        working-directory: qe_v10
        run: forge test -vvv
