<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050806">
<title>SINERGYCHAIN · Loading Growth OS V7</title>
<style>
:root{color-scheme:dark;--g:#00e878;--bg:#040605;--line:#1d3426;--muted:#91a098}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,sans-serif}#frame{width:100%;height:100%;border:0;background:#050806;display:none}.boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 10%,#123a24 0,transparent 34%),#040605;color:#fff}.card{width:min(720px,100%);padding:36px;border:1px solid var(--line);border-radius:24px;background:#08100bbb;box-shadow:0 30px 120px #000}.brand{font-weight:900;letter-spacing:4px;color:var(--g);font-size:13px}.card h1{font-size:clamp(38px,7vw,78px);line-height:.92;letter-spacing:-3px;margin:22px 0}.card h1 em{color:var(--g);font-style:normal}.card p{color:var(--muted);line-height:1.65}.track{height:5px;background:#142019;border-radius:9px;overflow:hidden;margin-top:26px}.track i{display:block;width:7%;height:100%;background:var(--g);box-shadow:0 0 18px var(--g);transition:.25s}.status{font-size:12px;color:#afbbb3;margin-top:12px}.error{color:#ff8b8b;white-space:pre-wrap}.retry{display:none;margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:var(--g);color:#031108;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<iframe id="frame" title="SINERGYCHAIN Growth OS V7"></iframe>
<div class="boot" id="boot"><section class="card"><div class="brand">SINERGYCHAIN · OGAS 2.0</div><h1>ЗАПУСКАЕМ<br><em>GROWTH OS V7</em></h1><p>Загружаем проверенную статическую сборку: OLGA AGI, бизнес-автопилот, AI SMM, CRM, Sales, CFO и API Vault.</p><div class="track"><i id="bar"></i></div><div class="status" id="status">Получаем пакет…</div><button class="retry" id="retry">Повторить</button></section></div>
<script>
const $=s=>document.querySelector(s), dec=new TextDecoder(), enc=new TextEncoder();
let files=new Map(), urls=new Map();
const mime=p=>p.endsWith('.css')?'text/css':p.endsWith('.js')?'text/javascript':p.endsWith('.json')?'application/json':p.endsWith('.svg')?'image/svg+xml':p.endsWith('.png')?'image/png':p.endsWith('.webmanifest')?'application/manifest+json':p.endsWith('.html')?'text/html':'application/octet-stream';
function setProgress(n,t){$('#bar').style.width=n+'%';$('#status').textContent=t}
function clean(p){p=decodeURIComponent(String(p||'')).split('#')[0].split('?')[0].replace(/^\.\//,'').replace(/^\//,'');return p}
function resolve(base,ref){ref=clean(ref);if(!ref)return'';if(ref.startsWith('public/'))return ref;if(ref.endsWith('/'))ref+='index.html';const stack=(base+'/'+ref).split('/'),out=[];for(const x of stack){if(!x||x==='.')continue;if(x==='..')out.pop();else out.push(x)}let p=out.join('/');if(!p.startsWith('public/'))p='public/'+p;return p}
function parseTar(buf){const u=new Uint8Array(buf);let o=0;while(o+512<=u.length){const h=u.subarray(o,o+512);let zero=true;for(const b of h)if(b){zero=false;break}if(zero)break;const name=dec.decode(h.subarray(0,100)).replace(/\0.*$/,'');const prefix=dec.decode(h.subarray(345,500)).replace(/\0.*$/,'');const full=(prefix?prefix+'/':'')+name;const raw=dec.decode(h.subarray(124,136)).replace(/\0.*$/,'').trim();const size=parseInt(raw||'0',8)||0;const data=u.slice(o+512,o+512+size);if(full&&!full.endsWith('/'))files.set(full,data);o+=512+Math.ceil(size/512)*512}}
function cssText(path){let css=dec.decode(files.get(path)||new Uint8Array());const dir=path.split('/').slice(0,-1).join('/');return css.replace(/url\((['"]?)([^)'"\s]+)\1\)/g,(m,q,r)=>{if(/^(data:|https?:|#)/i.test(r))return m;const p=resolve(dir,r);return urls.has(p)?`url("${urls.get(p)}")`:m})}
function transform(path){let html=dec.decode(files.get(path)||files.get('public/index.html'));const dir=path.split('/').slice(0,-1).join('/');html=html.replace(/<link\b([^>]*?)href=["']([^"']+)["']([^>]*)>/gi,(m,a,r,b)=>{if(!/stylesheet/i.test(m))return m;const p=resolve(dir,r);return files.has(p)?`<style data-source="${p}">${cssText(p)}</style>`:m});html=html.replace(/<script\b([^>]*?)src=["']([^"']+)["']([^>]*)><\/script>/gi,(m,a,r,b)=>{const p=resolve(dir,r);if(!files.has(p))return m;let js=dec.decode(files.get(p)).replace(/<\/script/gi,'<\\/script');return `<script data-source="${p}">${js}<\/script>`});html=html.replace(/\b(src|href)=["']([^"']+)["']/gi,(m,k,r)=>{if(/^(#|mailto:|tel:|javascript:|data:|https?:)/i.test(r))return m;const p=resolve(dir,r);if(/\.html?$/.test(p)||files.has(p)&&p.endsWith('/index.html'))return `${k}="#" data-sinergy-route="${p.replace(/^public\//,'')}"`;return urls.has(p)?`${k}="${urls.get(p)}"`:m});const bridge=`<script>window.__SINERGY_STATIC__=true;document.addEventListener('click',e=>{const a=e.target.closest('a[data-sinergy-route]');if(!a)return;e.preventDefault();parent.postMessage({type:'sinergy-route',path:a.dataset.sinergyRoute},'*')});<\/script>`;return html.replace(/<head>/i,'<head><base href="./">').replace(/<\/body>/i,bridge+'</body>')}
function render(route){let p=clean(route||'index.html');if(!p||p==='synergychain')p='index.html';if(p.endsWith('/'))p+='index.html';if(!p.startsWith('public/'))p='public/'+p;if(!files.has(p))p='public/404.html';const frame=$('#frame');frame.srcdoc=transform(p);frame.style.display='block';$('#boot').style.display='none';history.replaceState(null,'','#/'+p.replace(/^public\//,''));document.title='SINERGYCHAIN · Growth OS V7'}
async function boot(){try{$('#retry').style.display='none';setProgress(8,'Получаем пакет V7…');const r=await fetch('source.tar.gz',{cache:'no-store'});if(!r.ok)throw new Error('Не удалось получить source.tar.gz: HTTP '+r.status);const stream=r.body.pipeThrough(new DecompressionStream('gzip'));const buf=await new Response(stream).arrayBuffer();setProgress(42,'Распаковываем экосистему…');parseTar(buf);if(!files.has('public/index.html'))throw new Error('В пакете отсутствует public/index.html');for(const [p,data] of files)if(!p.endsWith('.html')&&!p.endsWith('.css')&&!p.endsWith('.js'))urls.set(p,URL.createObjectURL(new Blob([data],{type:mime(p)})));setProgress(78,'Подключаем интерфейсы…');await new Promise(r=>setTimeout(r,120));setProgress(100,'Готово');const route=location.hash.replace(/^#\//,'')||'index.html';render(route)}catch(e){console.error(e);$('#status').className='status error';$('#status').textContent='Ошибка запуска:\n'+e.message;$('#retry').style.display='inline-block'}}
addEventListener('message',e=>{if(e.data?.type==='sinergy-route')render(e.data.path)});addEventListener('hashchange',()=>{if(files.size)render(location.hash.replace(/^#\//,''))});$('#retry').onclick=boot;boot();
</script>
</body>
</html>
